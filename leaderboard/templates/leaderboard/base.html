{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Rank — UMSLibrary Leaderboard</title>
  <link rel="icon" type="image/png" href="{% static 'img/logo4.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=54">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    //  default theme menjadi dark
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
  </script>
</head>

<body>

  <header class="ums-header">
    <div class="header-left">
      <a href="https://library.ums.ac.id/" target="_blank" class="logo-lockup">
        <img src="{% static 'img/UMS Lib Polos (1).png' %}" alt="UMS Library Logo" class="ums-logo-img logo-light"
          onerror="this.style.display='none';">
        <img src="{% static 'img/logo4.png' %}" alt="UMS Library Logo" class="ums-logo-img logo-dark"
          onerror="this.style.display='none';">
      </a>
    </div>

    <style>
      .logo-dark {
        display: none;
      }

      html[data-theme='dark'] .logo-light {
        display: none;
      }

      html[data-theme='dark'] .logo-dark {
        display: block;
      }
    </style>

    <nav class="header-nav">
      <div class="nav-item">
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">LEADERBOARD</a>
      </div>
      <div class="nav-item">
        <a href="/seminar/" class="nav-link {% if request.path == '/seminar/' %}active{% endif %}">SEMINAR</a>
      </div>
      <div class="nav-item">
        <a href="#" class="nav-link" id="btnPanduan">PANDUAN</a>
      </div>
    </nav>

    <div class="header-right">
      <button id="themeToggle" class="header-btn header-btn-icon" title="Ganti Mode Terang / Gelap" style="width: 38px; height: 38px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; color: var(--text);">
        <span id="themeIconContainer" style="display:flex; align-items:center; justify-content:center;">
          <svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </span>
      </button>
    </div>
  </header>

  {% block content %}{% endblock %}

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Tutup">
        <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <span id="toastIcon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    </span>
    <span id="toastMsg">Done!</span>
  </div>

  <script>
    const CSRF_TOKEN = '{{ csrf_token }}';
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="{% static 'js/main.js' %}?v=35"></script>
  <script>
    const themeBtn = document.getElementById('themeToggle');
    const themeIconContainer = document.getElementById('themeIconContainer');
    
    const SUN_SVG = `<svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
    const MOON_SVG = `<svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      if (themeIconContainer) {
        themeIconContainer.innerHTML = (theme === 'dark') ? SUN_SVG : MOON_SVG;
      }
      if (themeBtn) {
        themeBtn.title = (theme === 'dark') ? 'Ganti ke Mode Terang (Light Mode)' : 'Ganti ke Mode Gelap (Dark Mode)';
      }
    }

    const initialTheme = localStorage.getItem('theme') || 'dark';
    applyTheme(initialTheme);

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        const newTheme = (currentTheme === 'dark') ? 'light' : 'dark';
        applyTheme(newTheme);
        if (typeof loadTab === 'function' && typeof currentTab !== 'undefined') {
          loadTab(currentTab);
        }
      });
    }
  </script>
</body>

</html>
