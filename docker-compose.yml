services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-B1sm1r0bb1k4123}
      MYSQL_DATABASE: ${DB_NAME:-testslims}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-B1sm1r0bb1k4123}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8002:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
    command: gunicorn --bind 0.0.0.0:8000 --certfile /app/cert.pem --keyfile /app/key.pem --workers 3 --timeout 120 --reload libraryrank.wsgi:application
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

